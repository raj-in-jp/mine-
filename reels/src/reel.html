<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--paper:#F3EBDD;--ink:#1C1A17;--soft:#5A5247;--red:#9B2C2C;--gold:#B8872B}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#paper{position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(ellipse at 50% 40%, rgba(255,250,240,.55) 0%, rgba(255,250,240,0) 55%),
   radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(80,55,25,.28) 100%);}
#grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:multiply;pointer-events:none}
.scene{position:absolute;inset:0;top:70px;transform-origin:50% 42%;display:none}
.txt{position:absolute;white-space:normal}
.ch{display:inline-block;will-change:transform}
.morph{vertical-align:bottom;white-space:pre}
.caret{color:var(--red)}
#chrome{position:absolute;inset:0;pointer-events:none;z-index:5}
.frame{position:absolute;inset:40px;border:2.5px solid rgba(28,26,23,.55)}
.frame2{position:absolute;inset:54px;border:1px solid rgba(28,26,23,.3)}
.tag{position:absolute;top:110px;left:100px;font:700 28px Inter;letter-spacing:.22em;color:var(--red);display:flex;align-items:center;gap:16px}
.tag .no{color:var(--soft);font-weight:500;letter-spacing:.12em}
.tag .dot{width:14px;height:14px;border-radius:50%;background:var(--red)}
#bar{position:absolute;left:0;top:0;height:10px;width:100%;background:var(--red);transform-origin:left;z-index:6}
.stamp{position:absolute;left:50%;font-family:Cinzel;font-weight:900;letter-spacing:.06em;border:9px solid;padding:6px 34px 0;border-radius:10px;filter:url(#rough);white-space:nowrap;mix-blend-mode:multiply}
.pin{position:absolute;background:var(--paper);border:2.5px solid var(--ink);padding:12px 22px 14px;box-shadow:7px 7px 0 rgba(28,26,23,.16);white-space:nowrap;transform-origin:left center}
.pin .pl{font:700 21px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.pin .pw{font:italic 400 52px/1.15 "Playfair Display";color:var(--ink)}
.pin .ps{font:500 24px Inter;color:var(--soft)}
.foot{position:absolute;left:0;right:0;top:1640px;display:flex;justify-content:center;align-items:center;gap:22px;font:italic 400 38px 'Playfair Display';color:var(--soft)}
.foot .fl{width:90px;height:2px;background:var(--soft);opacity:.6}
.tl-row{position:absolute}
.tl-yr{font:700 26px Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.tl-w{font:600 70px/1.1 "Playfair Display";color:var(--ink)}
.tl-w.hot{color:var(--red)}
.tl-n{font:500 30px Inter;color:var(--soft);margin-top:4px}
.chip{position:absolute;left:50%;font:italic 400 76px/1 "Playfair Display";color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:14px 56px 22px;background:rgba(255,255,255,.4);white-space:nowrap}
.follow{position:absolute;left:0;right:0;margin:auto;width:fit-content;font:600 40px Inter;color:var(--paper);background:var(--ink);border-radius:999px;padding:24px 48px}
.follow span{color:#E8B04A;font-weight:800;margin-right:8px}
b{color:var(--red);font-weight:600}
</style></head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
      <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="14" stroke="#B9A88A" stroke-width="1.4"/></pattern>
    </defs>
  </svg>
  <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .18  0 0 0 .9 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div id="paper"></div>
  <div id="bar"></div>
  <div id="chrome"></div>
</div>
<script src="engine.js"></script>
<script src="reels.js"></script>
<script>
(async () => {
  MAP = await (await fetch('map.json')).json().catch(() => null);
  await document.fonts.load('600 100px "Playfair Display"'); await document.fonts.load('italic 400 100px "Playfair Display"');
  await document.fonts.load('700 100px Cinzel'); await document.fonts.load('900 100px Cinzel'); await document.fonts.load('500 40px Inter'); await document.fonts.load('700 40px Inter');
  const r = new URLSearchParams(location.search).get('r') || 'nice';
  REELS[r]();
  // paper/grain must sit above scenes? keep scenes under grain: move stage children order
  const stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('grain')); stage.appendChild(document.getElementById('chrome')); stage.appendChild(document.getElementById('bar'));
  render(0);
  window.READY = true;
})();
</script>
</body></html>
