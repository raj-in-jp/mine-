<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.t{position:absolute;left:0;right:0;text-align:center;z-index:10}
.mk{background:linear-gradient(#F3D27F,#F3D27F) no-repeat 0 88%/100% 38%;padding:0 10px}
</style></head><body><div id="stage"></div>
<script src="engine.js"></script><script src="style2.js"></script><script src="reels4.js"></script><script src="reels5.js"></script>
<script>
const v=new URLSearchParams(location.search).get('v')||'babies', st=document.getElementById('stage');
const add=h=>st.insertAdjacentHTML('beforeend',h);
if(v==='babies'){
  st.style.background=K.sky;
  add(`<div style="position:absolute;left:-200px;top:300px;width:1480px;height:1480px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.35) 0 10deg,transparent 10deg 20deg)"></div>`);
  add(`<div class="t" style="top:280px;font:600 30px Inter;letter-spacing:.32em;color:${K.rust}">LANGUAGE SCIENCE</div>`);
  add(`<div class="t" style="top:335px;font:500 132px/1.02 'EB Garamond';color:${K.ink}">Babies cry<br>with an <span class="mk" style="font-style:italic;font-weight:700;color:${K.rust}">accent</span></div>`);
  const sv=svgBox(st,0,0,1080,1920); const a=baby(sv,290,1180,1.35,'beret'), b=baby(sv,790,1180,1.35,'beanie');
  [a,b].forEach(x=>{x.mouth.setAttribute('ry',30);x.tears.forEach(t=>t.setAttribute('opacity',1))});
  const p1=h('path',{d:'M140,880 C220,870 300,820 420,700',fill:'none',stroke:'#2E4FA0','stroke-width':18,'stroke-linecap':'round'},sv);
  const p2=h('path',{d:'M660,700 C760,720 840,780 940,880',fill:'none',stroke:'#D7263D','stroke-width':18,'stroke-linecap':'round'},sv);
  add(`<div class="t" style="top:1530px"><span style="display:inline-block;padding:10px 44px 16px;background:${K.cream};border:6px solid ${K.ink};border-radius:999px;font:italic 600 64px 'EB Garamond';color:${K.ink}">French ↗ &nbsp;vs&nbsp; German ↘</span></div>`);
}
if(v==='hebrew'){
  st.style.background='linear-gradient(#264653,#E76F51 62%,#F9D29D)';
  add(`<div style="position:absolute;left:340px;top:1060px;width:400px;height:400px;border-radius:50%;background:#FFE3A3;box-shadow:0 0 140px 60px rgba(255,227,163,.6)"></div>`);
  add(`<div class="t" style="top:280px;font:600 30px Inter;letter-spacing:.32em;color:#E9B44C">BACK FROM SILENCE</div>`);
  add(`<div class="t" style="top:335px;font:500 104px/1.04 'EB Garamond';color:#F7F0E6">Nobody's first language<br>for <span class="mk" style="font-style:italic;font-weight:700;color:${K.rust}">1,700 years</span></div>`);
  add(`<div class="t" style="top:720px;font:700 260px/1 Rubik;color:#E9B44C;text-shadow:0 0 60px rgba(233,180,76,.6),0 12px 0 rgba(0,0,0,.3);direction:rtl">עברית</div>`);
  const sv=svgBox(st,0,0,1080,1920);
  for(let i=0;i<9;i++){const x=i*122,hh=250+rnd(i,6)*260;h('rect',{x,y:1560-hh,width:110,height:hh+500,fill:i%2?'#3A2E3F':'#4A3B50',...OL,'stroke-width':4},sv);for(let k=0;k<3;k++)h('rect',{x:x+25,y:1560-hh+40+k*70,width:26,height:36,fill:'#FFD36B'},sv)}
  h('rect',{y:1560,width:1080,height:400,fill:'#2B2235'},sv);
  ['שלום','אמא','תודה','חבר','אבא'].forEach((w,i)=>add(`<div style="position:absolute;z-index:9;left:${90+i*190}px;top:${1130+(i%2)*90}px;padding:6px 22px 12px;background:#fff;border:5px solid ${K.ink};border-radius:28px;font:700 52px Rubik;color:${BLK[i]};direction:rtl;transform:rotate(${(i%2?4:-4)}deg)">${w}</div>`));
  add(`<div class="t" style="top:1585px"><span style="display:inline-block;padding:8px 40px 14px;background:${K.cream};border:6px solid ${K.ink};border-radius:999px;font:italic 600 56px 'EB Garamond';color:${K.ink}">Today: 9 million speakers</span></div>`);
}
add(`<div class="t" style="top:1730px;font:italic 500 44px 'EB Garamond';color:${v==='hebrew'?'#F7F0E6':K.ink}">@wordology.lab</div>`);
</script></body></html>
