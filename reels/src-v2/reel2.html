<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#EFE6DA;font-family:"EB Garamond"}
.scene{position:absolute;inset:0;transform-origin:50% 45%;display:none}
.navyscene{background:#2E4560}
.sent{position:absolute;left:100px;top:230px;width:880px;font:400 88px/1.18 "EB Garamond";color:#231F1B;letter-spacing:-.005em}
.sent.navy{top:auto;bottom:auto;top:640px;text-align:center;left:90px;width:900px;font-size:92px;color:#F7F0E6}
.w{display:inline-block;opacity:0;will-change:transform}
.w.em{font-style:italic;font-weight:700;color:#A63D2A;font-size:1.12em;line-height:1}
.navy .w.em{color:#E9A47F}
.big{position:absolute;left:50%;transform:translate(-50%,-50%);font-family:"EB Garamond";font-weight:500;color:#231F1B;line-height:1;white-space:nowrap;opacity:0}
.split{display:flex;align-items:baseline}
.part{position:relative;display:inline-block}
.sub{position:absolute;left:50%;top:100%;transform:translate(-50%,0);font:italic 400 60px "EB Garamond";color:#7A6F64;white-space:nowrap;opacity:0;margin-top:20px}
.mch{display:inline-block;vertical-align:bottom;white-space:pre}
.lab{position:absolute;font:italic 500 56px "EB Garamond";color:#7A6F64;opacity:0}
.mapt{font-family:"EB Garamond";font-style:italic;font-weight:600;fill:#231F1B}
.mapt.hot{fill:#A63D2A;font-weight:700}
.maps{font-style:italic;font-weight:400;fill:#7A6F64}
.pill{position:absolute;left:50%;transform:translateX(-50%);font:600 44px "EB Garamond";color:#F7F0E6;background:#2E4560;border-radius:999px;padding:18px 56px 24px;opacity:0}
#foot{position:absolute;left:0;right:0;top:1650px;text-align:center;font:italic 500 44px "EB Garamond";z-index:5}
#bar{display:none}
.cell{position:absolute;display:flex;align-items:center;justify-content:center;font:500 84px "EB Garamond";color:#231F1B;opacity:0;box-sizing:border-box}
.cell.slot{border:5px dashed #A63D2A;border-radius:14px}
.ampc{font:italic 600 104px "EB Garamond";color:#A63D2A;display:inline-block}
.chalk{position:absolute;font:italic 500 190px "EB Garamond";color:#F1EADF;opacity:0}
</style></head>
<body>
<div id="stage"><div id="bar"></div><div id="foot">@wordology.lab</div></div>
<script src="engine.js"></script>
<script src="style2.js"></script>
<script src="reels2.js"></script>
<script>
(async () => {
  const r = new URLSearchParams(location.search).get('r') || 'nice';
  MAP = await (await fetch('map.json')).json();
  VO = await (await fetch(`vo/${r}.json`)).json();
  const S = await (await fetch('scripts.json')).json();
  for (const f of ['400 80px "EB Garamond"', 'italic 700 80px "EB Garamond"', 'italic 600 80px "EB Garamond"', 'italic 500 80px "EB Garamond"', 'italic 400 80px "EB Garamond"', '500 80px "EB Garamond"', '600 80px "EB Garamond"']) await document.fonts.load(f);
  build(r, S[r], VIS[r]);
  document.getElementById('stage').appendChild(document.getElementById('foot'));
  render(0); window.READY = true;
})();
</script>
</body></html>
